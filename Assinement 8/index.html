<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Regex Matcher Clone</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Regex101 Clone</h2>
        <div class="card shadow p-4">
            <form action="/" method="POST">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Regular Expression</label>
                    <input type="text" name="regex_pattern" class="form-control" placeholder="e.g. [a-z0-9]+" value="{{ regex_pattern }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Test String</label>
                    <textarea name="test_string" class="form-control" rows="5" placeholder="Enter text to search here..." required>{{ test_string }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Find Matches</button>
            </form>
        </div>

        {% if results %}
        <div class="mt-4">
            <h4>Match Information:</h4>
            <ul class="list-group">
                {% for match in results %}
                <li class="list-group-item list-group-item-success">Found: <strong>{{ match }}</strong></li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
    </div>
</body>
</html>
