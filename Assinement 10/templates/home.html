<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>URL Shortener</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">ShortenIt</a>
            <a class="btn btn-outline-light" href="/history">View History</a>
        </div>
    </nav>

    <div class="container text-center">
        <h1 class="mb-4">Shorten Your Long URL</h1>
        
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" class="card p-4 shadow-sm">
            <div class="input-group mb-3">
                <input type="text" name="url" class="form-control" placeholder="Paste your long link here..." required>
                <button class="btn btn-primary" type="submit">Shorten!</button>
            </div>

            {% if short_url %}
            <div class="mt-4">
                <label>Your Shortened URL:</label>
                <div class="input-group">
                    <input type="text" id="shortUrl" class="form-control" value="{{ short_url }}" readonly>
                    <button class="btn btn-success" onclick="copyToClipboard()">Copy</button>
                </div>
            </div>
            {% endif %}
        </form>
    </div>

    <script>
        function copyToClipboard() {
            var copyText = document.getElementById("shortUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Copied: " + copyText.value);
        }
    </script>
</body>
</html>
